<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay via UPI — RentVelo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f4f6;
      color: #111;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .amount { font-size: 2rem; font-weight: 700; margin: 16px 0; color: #059669; }
    .meta { font-size: 0.9rem; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:active { opacity: 0.9; }
    .err { color: #b91c1c; font-size: 0.95rem; }
    .brand { margin-top: 20px; font-size: 0.75rem; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <p class="err" id="error" hidden></p>
    <div id="content" hidden>
      <h1>Pay rent via UPI</h1>
      <div class="amount" id="amount"></div>
      <div class="meta" id="meta"></div>
      <a class="btn" id="payBtn" href="#">Open UPI app to pay</a>
      <p class="brand" id="hint">If your UPI app didn&apos;t open, tap the button above.</p>
      <p class="brand">RentVelo</p>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var pa = (params.get('pa') || '').trim();
      var am = parseFloat(params.get('am') || '');
      var pn = (params.get('pn') || '').trim();
      var tn = (params.get('tn') || '').trim();
      var cu = (params.get('cu') || 'INR').trim() || 'INR';

      var errEl = document.getElementById('error');
      var content = document.getElementById('content');

      if (!pa || !Number.isFinite(am) || am <= 0) {
        errEl.hidden = false;
        errEl.textContent = 'Invalid payment link. Ask your landlord to send a new reminder.';
        return;
      }

      var query = [
        'pa=' + encodeURIComponent(pa),
        'am=' + encodeURIComponent(am.toFixed(2)),
        'cu=' + encodeURIComponent(cu)
      ];
      if (pn) query.push('pn=' + encodeURIComponent(pn.slice(0, 50)));
      if (tn) query.push('tn=' + encodeURIComponent(tn.slice(0, 80)));

      var upiUrl = 'upi://pay?' + query.join('&');

      document.getElementById('amount').textContent = '\u20B9' + am.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var meta = 'Pay to: ' + pa;
      if (pn) meta += '<br/>' + pn;
      if (tn) meta += '<br/>Note: ' + tn;
      document.getElementById('meta').innerHTML = meta;

      var btn = document.getElementById('payBtn');
      btn.href = upiUrl;
      btn.addEventListener('click', function () {
        window.location.href = upiUrl;
      });

      content.hidden = false;

      // Try to open UPI immediately (works on many in-app browsers after WhatsApp link tap).
      // Browsers may block this; the button below is the reliable fallback.
      setTimeout(function () {
        window.location.href = upiUrl;
      }, 400);
    })();
  </script>
</body>
</html>
